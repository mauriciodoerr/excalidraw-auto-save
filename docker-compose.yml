services:
  excalidraw:
    build:
      context: .
      args:
        - NODE_ENV=development
    container_name: excalidraw
    ports:
      - "3000:80"
    restart: on-failure
    stdin_open: true
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/opt/node_app/app:delegated
      - ./package.json:/opt/node_app/package.json
      - ./yarn.lock:/opt/node_app/yarn.lock
      - notused:/opt/node_app/app/node_modules

  # Sidecar: handles file persistence and git operations
  auto-save-server:
    build:
      context: ./auto-save-server
    container_name: excalidraw-auto-save
    ports:
      - "3001:3001"
    restart: on-failure
    environment:
      - PORT=3001
      # Path inside the container where the drawing is saved
      - SAVE_PATH=/data/drawing.excalidraw
      # Allow requests from the Excalidraw app
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      # Mount a local ./data directory for drawing persistence
      - ./data:/data
      # Mount the whole ~/.ssh directory (read-only).
      # The key filename is configured via the git dialog in the app.
      - ~/.ssh:/root/.ssh:ro

volumes:
  notused:
